<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Card Game</title>
<style>
body{font-family:Arial;text-align:center;background:#1a1a2e;color:white}
h1{color:#ffd700}
#game{display:grid;grid-template-columns:repeat(4,80px);gap:10px;justify-content:center;margin:20px auto}
.card{width:80px;height:80px;background:#e94560;border-radius:10px;font-size:35px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card.open{background:white;color:black}
button{padding:10px 20px;font-size:18px;background:#ffd700;border:none;border-radius:10px}
</style>
</head>
<body>
<h1>🎮 Memory Card Game</h1>
<p>Moves: <span id="moves">0</span> | Matched: <span id="matched">0</span>/8</p>
<div id="game"></div>
<button onclick="location.reload()">Restart 🔄</button>
<script>
let emojis=['🍎','🍎','🍌','🍌','🍇','🍇','🍓','🍓','🍕','🍕','⚽','⚽','🚗','🚗','⭐','⭐'];
emojis.sort(()=>Math.random()-0.5);
let game=document.getElementById('game');
let first=null, lock=false, moves=0, matched=0;
emojis.forEach(e=>{
  let d=document.createElement('div');
  d.className='card'; d.dataset.v=e; d.textContent='?';
  d.onclick=()=>{
    if(lock||d.classList.contains('open')) return;
    d.classList.add('open'); d.textContent=e;
    if(!first){first=d; return;}
    moves++; document.getElementById('moves').textContent=moves;
    if(first.dataset.v===e){
      matched++; document.getElementById('matched').textContent=matched;
      first=null;
      if(matched===8) setTimeout(()=>alert('Jeet Gaye! 🎉 Moves: '+moves),300);
    } else {
      lock=true;
      let s=first; first=null;
      setTimeout(()=>{s.classList.remove('open'); s.textContent='?'; d.classList.remove('open'); d.textContent='?'; lock=false;},800);
    }
  };
  game.appendChild(d);
});
</script>
</body>
</html>
